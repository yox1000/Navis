<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NeuralSeek API Demo</title>
<style>
  body { font-family: system-ui; margin: 2rem; }
  input { width: 60%; padding: 0.4rem; }
  button { padding: 0.4rem 0.8rem; margin-left: 0.5rem; }
  pre { background: #f6f6f6; padding: 1rem; border-radius: 0.5rem; margin-top: 1rem; white-space: pre-wrap; }
</style>
</head>
<body>
<h2>Ask NeuralSeek</h2>
<input type="text" id="questionInput" placeholder="Type your question here">
<button id="askBtn">Ask</button>

<h3>Response:</h3>
<pre id="responseArea">—</pre>

<script>
const askBtn = document.getElementById('askBtn');
const questionInput = document.getElementById('questionInput');
const responseArea = document.getElementById('responseArea');

askBtn.addEventListener('click', async () => {
  const question = questionInput.value.trim();
  if (!question) {
    alert('Please enter a question.');
    return;
  }
  
  try {
    const payload = {
        agent: "test",
        params: [
            {
                "name": "question",
                "value": question
            }
        ]
    };

    const apiKey = 'f4d488a0-b400d693-59e0b59f-1682b8db'; // replace this
    const resp = await fetch('https://stagingapi.neuralseek.com/v1/stony13/maistro', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'accept': 'application/json',
        'apikey': apiKey
      },
      body: JSON.stringify(payload)
    });

    if (!resp.ok) {
      const err = await resp.text();
      throw new Error('API error: ' + err);
    }

    const data = await resp.json();
    responseArea.textContent = JSON.stringify(data, null, 2);
  } catch (err) {
    responseArea.textContent = 'Error: ' + err.message;
  }
});
</script>
</body>
</html>
